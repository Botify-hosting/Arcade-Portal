<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>My Arcade Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ARCADE_OS</h1>
        <div class="controls">
            <input type="text" id="searchBar" placeholder="Zoek een game...">
            <button onclick="loadRandomGame()">Random Game</button>
        </div>
        <nav id="categories">
            <!-- Categorieën komen hier via JS -->
        </nav>
    </header>

    <main id="gameGrid">
        <!-- Game kaarten komen hier via JS -->
    </main>

    <!-- De Overlay voor het spelen -->
    <div id="gameOverlay" class="hidden">
        <button id="closeGame">TERUG NAAR MENU</button>
        <iframe id="gameFrame" src=""></iframe>
    </div>

    <script src="main.js"></script>
</body>
</html>
