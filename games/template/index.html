<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { border: 2px solid #00ff41; background: #050505; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 600;

        // --- HIER KOMT JOUW GAME LOGICA ---
        function update() {
            // Teken iets simpels om te testen
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#00ff41";
            ctx.font = "30px Courier New";
            ctx.fillText("Jouw Game Start Hier!", 230, 300);
            
            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
